name: Esquema Supabase

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  permisos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Tests de permisos
        run: supabase/tests/run.sh
      - name: Mutaciones (los tests deben fallar con un esquema roto a propósito)
        run: supabase/tests/mutaciones.sh
